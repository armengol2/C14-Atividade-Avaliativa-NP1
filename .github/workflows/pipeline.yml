name: CI/CD Pipeline NP1 - Inatel C14

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  JAVA_VERSION: '22'
  # Remove os avisos de depreciação do Node.js 20
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # Job 1: Testes Unitários
  tests:
    name: Testes unitarios
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Executar testes
        run: mvn -B clean test

      - name: Publicar relatorio de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: target/surefire-reports/
          if-no-files-found: warn

  # Job 2: Build e Empacotamento
  build:
    name: Build e empacotamento
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Gerar pacote JAR
        run: mvn -B -DskipTests clean package

      - name: Publicar JAR como artifact
        uses: actions/upload-artifact@v4
        with:
          name: pacote-projeto
          path: target/*.jar
          if-no-files-found: error

  # Job 3: Deploy no GitHub Pages
  deploy:
    name: Deploy no GitHub Pages
    runs-on: ubuntu-latest
    needs: [ tests, build ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar pacote gerado
        uses: actions/download-artifact@v4
        with:
          name: pacote-projeto
          path: dist

      - name: Preparar pagina para deploy
        env:
          BUILD_STATUS: ${{ needs.build.result }}
          TEST_STATUS: ${{ needs.tests.result }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          mkdir -p site/downloads
          JAR_FILE="$(find dist -maxdepth 1 -name '*.jar' | head -n 1)"
          if [ -z "$JAR_FILE" ]; then
            echo "Nenhum arquivo JAR foi encontrado." >&2
            exit 1
          fi
          cp "$JAR_FILE" site/downloads/finance-app.jar
          BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          cat <<EOF > site/index.html
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
            <meta charset="UTF-8">
            <title>FinanceApp - Deploy Inatel</title>
            <style>
              body { font-family: sans-serif; background: #f4f4f9; padding: 50px; color: #333; }
              .container { max-width: 700px; margin: auto; background: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
              .btn { display: inline-block; padding: 15px 25px; background: #007bff; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>Pipeline FinanceApp - NP1</h1>
              <p>O deploy automático foi concluído com sucesso.</p>
              <hr>
              <p><strong>Status dos Testes:</strong> $TEST_STATUS</p>
              <p><strong>Status do Build:</strong> $BUILD_STATUS</p>
              <a href="./downloads/finance-app.jar" class="btn" download>Baixar Executável (.JAR)</a>
              <p style="margin-top:20px; font-size: 0.8em; color: #777;">Gerado em: $BUILD_DATE</p>
            </div>
          </body>
          </html>
          EOF

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publicar artifact do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Executar deploy
        id: deployment
        uses: actions/deploy-pages@v4

  # Job 4: Notificação
  notification:
    name: Notificacao
    runs-on: ubuntu-latest
    needs: [ tests, build, deploy ]
    if: always()
    steps:
      - name: Enviar E-mail de Relatorio
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.EMAIL_DESTINO }}
          from: "Pipeline NP1 - Inatel"
          subject: "Relatorio Pipeline C14 - Inatel"
          body: |
            Chegou! Chegaram os relatórios da pipeline!!!

            Status Final:
            - [cite_start]Testes: ${{ needs.tests.result }} [cite: 22]
            - [cite_start]Build: ${{ needs.build.result }} [cite: 22]
            - [cite_start]Deploy: ${{ needs.deploy.result }} [cite: 65]

            Confira tudo no GitHub: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}