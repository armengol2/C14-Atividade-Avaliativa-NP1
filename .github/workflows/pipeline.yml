name: CI/CD Pipeline NP1 - Inatel C14

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
 
  tests:
    name: Execução de Testes Unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: 'maven'
      - name: Rodar Testes (Mínimo 20 cenários exigidos)
        run: mvn test
      - [cite_start]name: Armazenar Relatório (Artifact) [cite: 23]
                          if: always()
                          uses: actions/upload-artifact@v4
                          with:
                            name: relatorio-testes
                            path: target/surefire-reports/

  build:
    name: Build e Empacotamento
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: 'maven'
      - [cite_start]name: Gerar Pacote Distribuível [cite: 18]
                          run: mvn package -DskipTests
      - [cite_start]name: Armazenar JAR (Artifact) [cite: 23]
                          uses: actions/upload-artifact@v4
                          with:
                            name: pacote-projeto
                            path: target/*.jar

  deploy:
                name: Deploy Automático
                runs-on: ubuntu-latest
    [cite_start]needs: [tests, build]
                steps:
                  - [cite_start]name: Instalação de Software via Script [cite: 24]
                                      run: |
                                        echo "Instalando JRE na máquina remota..."
                                        sudo apt-get update && sudo apt-get install -y openjdk-22-jre-headless
                  - [cite_start]name: Executar Deploy [cite: 57]
                                      run: echo "Efetuando deploy dos artefatos..."

  notification:
    [cite_start]name: Notificação via Script Bash [cite: 18]
                runs-on: ubuntu-latest
                needs: [tests, build, deploy]
                if: always()
                steps:
                  - [cite_start]name: Script de Envio de E-mail [cite: 18, 29]
                                      env:
                                        MAIL_USER: ${{ secrets.MAIL_USERNAME }}
                                        MAIL_PASS: ${{ secrets.MAIL_PASSWORD }}
                                        MAIL_TO: ${{ secrets.EMAIL_DESTINO }}

                                        TEST_STATUS: ${{ needs.tests.result }}
                                        BUILD_STATUS: ${{ needs.build.result }}
                                      run: |
                                        sudo apt-get update && sudo apt-get install -y swaks
                                        swaks --server smtp.gmail.com --port 587 --auth LOGIN \
                                          --auth-user "$MAIL_USER" --auth-password "$MAIL_PASS" \
                                          --to "$MAIL_TO" \
                                          --from "$MAIL_USER" \
                                          --header "Subject: Relatorio Pipeline C14 - Inatel" \
                                          --body "Resultado do Pipeline: Testes($TEST_STATUS), Build($BUILD_STATUS). Deploy realizado com sucesso." \
                                          --tls