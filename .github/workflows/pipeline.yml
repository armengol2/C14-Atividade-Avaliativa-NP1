name: CI/CD Pipeline NP1 - Inatel C14

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    name: Execução de Testes Unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: 'maven'
      - name: Rodar Testes (Mínimo 20 cenários exigidos)
        run: mvn test
      - name: Armazenar Relatório (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: target/surefire-reports/

  build:
    name: Build e Empacotamento
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: 'maven'
      - name: Gerar Pacote Distribuível
        run: mvn package -DskipTests
      - name: Armazenar JAR (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: pacote-projeto
          path: target/*.jar

  deploy:
    name: Deploy Automático
    runs-on: ubuntu-latest
    needs: [ tests, build ]
    steps:
      - name: Baixar Pacote (Artifact)
        uses: actions/download-artifact@v4
        with:
          name: pacote-projeto

      - name: Instalação de Software via Script
        run: |
          echo "Instalando dependências necessárias..."
          sudo apt-get update
          # Instalando o JRE conforme exigido no workflow [cite: 24]
          sudo apt-get install -y openjdk-22-jre-headless

      - name: Executar Simulação de Deploy Real
        run: |
          mkdir -p final_deploy
          cp *.jar final_deploy/
          echo "Deploy realizado com sucesso em $(date)" > final_deploy/log.txt

  notification:
    name: Notificação via Script Bash
    runs-on: ubuntu-latest
    needs: [tests, build, deploy]
    if: always()
    steps:
      - name: Script de Envio de E-mail
        env:
          MAIL_USER: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASS: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.EMAIL_DESTINO }}
          TEST_STATUS: ${{ needs.tests.result }}
          BUILD_STATUS: ${{ needs.build.result }}
        run: |
          sudo apt-get update && sudo apt-get install -y swaks
          swaks --server smtp.gmail.com --port 587 --auth LOGIN \
            --auth-user "$MAIL_USER" --auth-password "$MAIL_PASS" \
            --to "$MAIL_TO" \
            --from "$MAIL_USER" \
            --header "Subject: Relatorio Pipeline C14 - Inatel" \
            --body "Resultado do Pipeline: Testes($TEST_STATUS), Build($BUILD_STATUS). Deploy realizado com sucesso." \
            --tls