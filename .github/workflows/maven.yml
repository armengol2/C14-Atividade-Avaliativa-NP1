name: CI/CD - Finance App

on:
  push:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  preparation:
    name: Preparacao do ambiente
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Instalar JDK 22
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "22"
          cache: maven

      - name: Validar ferramentas do ambiente
        run: |
          if ! command -v mvn >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y maven
          fi
          java -version
          mvn -version

  tests:
    name: Testes unitarios
    runs-on: ubuntu-latest
    needs: preparation

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Instalar JDK 22
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "22"
          cache: maven

      - name: Instalar Maven se necessario
        run: |
          if ! command -v mvn >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y maven
          fi
          mvn -version

      - name: Executar testes unitarios
        run: mvn -B test --file pom.xml

      - name: Salvar relatorio de testes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-testes
          path: target/surefire-reports/
          if-no-files-found: warn

  package:
    name: Build e empacotamento
    runs-on: ubuntu-latest
    needs: preparation

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Instalar JDK 22
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "22"
          cache: maven

      - name: Instalar Maven se necessario
        run: |
          if ! command -v mvn >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y maven
          fi
          mvn -version

      - name: Gerar pacote distribuivel
        run: mvn -B -DskipTests package --file pom.xml

      - name: Salvar pacote como artifact
        uses: actions/upload-artifact@v7
        with:
          name: finance-app-package
          path: target/*.jar
          if-no-files-found: error

  deploy:
    name: Deploy automatico
    runs-on: ubuntu-latest
    needs: [ tests, package ]
    if: github.event_name == 'push' && needs.tests.result == 'success' && needs.package.result == 'success'

    steps:
      - name: Baixar pacote gerado no build
        uses: actions/download-artifact@v8
        with:
          name: finance-app-package
          path: release

      - name: Preparar pacote de deploy
        run: |
          mkdir -p deploy
          cp release/*.jar deploy/
          {
            echo "Projeto: Finance App"
            echo "Commit: ${GITHUB_SHA}"
            echo "Deploy automatico gerado em: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          } > deploy/deploy-info.txt

      - name: Publicar deploy como artifact
        uses: actions/upload-artifact@v7
        with:
          name: finance-app-deploy
          path: deploy/
          if-no-files-found: error

  notify:
    name: Notificacao
    runs-on: ubuntu-latest
    needs: [ tests, package, deploy ]
    if: always()

    steps:
      - name: Gerar notificacao da pipeline
        env:
          EVENT_NAME: ${{ github.event_name }}
          TEST_STATUS: ${{ needs.tests.result }}
          PACKAGE_STATUS: ${{ needs.package.result }}
          DEPLOY_STATUS: ${{ needs.deploy.result }}
        run: |
          pipeline_status="SUCESSO"

          if [ "$TEST_STATUS" != "success" ] || [ "$PACKAGE_STATUS" != "success" ]; then
            pipeline_status="FALHA"
          fi

          if [ "$EVENT_NAME" = "push" ] && [ "$DEPLOY_STATUS" != "success" ]; then
            pipeline_status="FALHA"
          fi

          {
            echo "## Notificacao da pipeline"
            echo ""
            echo "- Status geral: ${pipeline_status}"
            echo "- Testes unitarios: ${TEST_STATUS}"
            echo "- Build e empacotamento: ${PACKAGE_STATUS}"
            echo "- Deploy automatico: ${DEPLOY_STATUS}"
            echo "- Workflow: ${GITHUB_WORKFLOW}"
            echo "- Commit: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Status geral da pipeline: ${pipeline_status}"
